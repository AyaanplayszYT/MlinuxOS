<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MlinuxOS - devlog 02</title>
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="desktop">
  <div class="icon" data-app="about" data-col="0" data-row="0">
    <div class="icon-box"></div>
    <div class="label">My Computer</div>
  </div>

  <div class="icon" data-app="notes" data-col="0" data-row="1">
    <div class="icon-box"></div>
    <div class="label">Notepad</div>
  </div>

  <div class="icon" data-app="terminal" data-col="0" data-row="2">
    <div class="icon-box"></div>
    <div class="label">Terminal</div>
  </div>

  <div class="icon" data-app="files" data-col="0" data-row="3">
    <div class="icon-box"></div>
    <div class="label">Project Structure</div>
  </div>
</div>

<div id="start-menu">
  <div class="sm-head">MlinuxOS</div>
  <div class="sm-item" data-app="about">My Computer</div>
  <div class="sm-item" data-app="notes">Notepad</div>
  <div class="sm-item" data-app="terminal">Terminal</div>
  <div class="sm-item" data-app="files">Project Structure</div>
</div>

<div id="taskbar">
  <button id="start-btn">Start</button>
  <div id="taskbar-apps"></div>
  <div id="clock">00:00:00</div>
</div>

<script src="script.js"></script>
</body>
</html>
