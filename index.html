<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MlinuxsOS</title>
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop">
  <div class="icon" data-app="about" data-col="0" data-row="0">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <rect x="2" y="3" width="20" height="14" rx="1" fill="#3f8ff5" stroke="#000" stroke-width="1.5"/>
        <rect x="9" y="18" width="6" height="3" fill="#3f8ff5" stroke="#000" stroke-width="1.5"/>
        <rect x="6" y="21" width="12" height="2" fill="#000"/>
      </svg>
    </div>
    <div class="label">My Computer</div>
  </div>

  <div class="icon" data-app="terminal" data-col="0" data-row="1">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <rect x="2" y="4" width="20" height="16" rx="1" fill="#111" stroke="#000" stroke-width="1.5"/>
        <path d="M5 9l4 3-4 3" stroke="#4dff4d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="11" y1="15" x2="16" y2="15" stroke="#4dff4d" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="label">Terminal</div>
  </div>

  <div class="icon" data-app="notes" data-col="0" data-row="2">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <rect x="4" y="2" width="16" height="20" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <line x1="7" y1="7" x2="17" y2="7" stroke="#999" stroke-width="1.5"/>
        <line x1="7" y1="11" x2="17" y2="11" stroke="#999" stroke-width="1.5"/>
        <line x1="7" y1="15" x2="14" y2="15" stroke="#999" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="label">Notepad</div>
  </div>

  <div class="icon" data-app="files" data-col="0" data-row="3">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <path d="M2 6h7l2 2h11v11H2z" fill="#ffcc4d" stroke="#000" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="label">My Documents</div>
  </div>

  <div class="icon" data-app="bin" data-col="1" data-row="0">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <rect x="5" y="8" width="14" height="12" fill="#c2c2c2" stroke="#000" stroke-width="1.5"/>
        <rect x="3" y="5" width="18" height="3" fill="#8b8b8b" stroke="#000" stroke-width="1.5"/>
        <rect x="9" y="2" width="6" height="3" fill="#8b8b8b" stroke="#000" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="label">Recycle Bin</div>
  </div>

  <div class="icon" data-app="settings" data-col="1" data-row="1">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <circle cx="12" cy="12" r="6" fill="#b8b8b8" stroke="#000" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <rect x="11" y="1" width="2" height="4" fill="#b8b8b8" stroke="#000" stroke-width="1"/>
        <rect x="11" y="19" width="2" height="4" fill="#b8b8b8" stroke="#000" stroke-width="1"/>
        <rect x="1" y="11" width="4" height="2" fill="#b8b8b8" stroke="#000" stroke-width="1"/>
        <rect x="19" y="11" width="4" height="2" fill="#b8b8b8" stroke="#000" stroke-width="1"/>
      </svg>
    </div>
    <div class="label">Settings</div>
  </div>

  <div class="icon" data-app="browser" data-col="1" data-row="2">
    <div class="glyph">
      <svg viewBox="0 0 24 24" width="32" height="32">
        <rect x="2" y="3" width="20" height="18" rx="1" fill="#fff" stroke="#000" stroke-width="1.5"/>
        <rect x="2" y="3" width="20" height="4" fill="#3f8ff5" stroke="#000" stroke-width="1.5"/>
        <circle cx="5" cy="5" r="0.8" fill="#fff"/>
        <circle cx="7.5" cy="5" r="0.8" fill="#fff"/>
        <circle cx="10" cy="5" r="0.8" fill="#fff"/>
        <circle cx="12" cy="14" r="5" fill="none" stroke="#3f8ff5" stroke-width="1.5"/>
        <line x1="7" y1="14" x2="17" y2="14" stroke="#3f8ff5" stroke-width="1"/>
      </svg>
    </div>
    <div class="label">Browser</div>
  </div>
</div>

<div id="taskbar">
  <button id="start-btn">Start</button>
  <div id="taskbar-apps"></div>

  <div id="tray">
    <span class="tray-icon" title="Wifi connected">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M2 8a14 14 0 0 1 20 0" stroke="#fff" stroke-width="2" fill="none"/>
        <path d="M5.5 12a9 9 0 0 1 13 0" stroke="#fff" stroke-width="2" fill="none"/>
        <path d="M9 16a4 4 0 0 1 6 0" stroke="#fff" stroke-width="2" fill="none"/>
        <circle cx="12" cy="19" r="1.3" fill="#fff"/>
      </svg>
    </span>
    <span class="tray-icon" title="Battery">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <rect x="2" y="7" width="18" height="10" rx="1" fill="none" stroke="#fff" stroke-width="2"/>
        <rect x="21" y="10" width="2" height="4" fill="#fff"/>
        <rect x="4" y="9" width="12" height="6" fill="#4dff4d"/>
      </svg>
    </span>
    <div id="clock">00:00:00</div>
  </div>
</div>

<div id="start-menu">
  <div class="sm-head">MlinuxsOS</div>
  <div class="sm-item" data-app="about">My Computer</div>
  <div class="sm-item" data-app="terminal">Terminal</div>
  <div class="sm-item" data-app="notes">Notepad</div>
  <div class="sm-item" data-app="files">My Documents</div>
  <div class="sm-item" data-app="bin">Recycle Bin</div>
  <div class="sm-item" data-app="settings">Settings</div>
  <div class="sm-item" data-app="browser">Browser</div>
  <div class="sm-item" data-app="lock">Lock Screen</div>
</div>

<div id="lock-screen">
  <div id="lock-bg"></div>
  <div class="lock-content">
    <h1>Welcome</h1>
    <p>Click anywhere to continue</p>
  </div>
</div>

<img id="cat-mascot" src="assets/cat.png" alt="cat">

<script src="script.js"></script>
</body>
</html>
