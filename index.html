<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MlinuxOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="desktop">

    <div class="icon">
      <div class="icon-box"></div>
      <div class="label">My Computer</div>
