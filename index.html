<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MlinuxOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="desktop" id="desktop">

    <div class="logo">MlinuxOS</div>

<div class="icon icon2" ondblclick="openWin('notes')">
  <img src="/assets/icons/notepad.png" alt="Notepad">
  <span>Notepad</span>
</div>

<div class="icon icon3" ondblclick="openWin('terminal')">
  <img src="/assets/icons/win.png" alt="Terminal">
  <span>Terminal</span>
</div>

<div class="icon icon4" ondblclick="openWin('weather')">
  <img src="/assets/icons/weather.png" alt="Weather">
  <span>Weather</span>
</div>

<div class="icon icon5" ondblclick="openWin('settings')">
  <img src="/assets/icons/computer.png" alt="Settings">
  <span>Settings</span>
</div>

<div class="icon icon6" ondblclick="openWin('trash')">
  <img src="/assets/icons/binfull.png" alt="Trash">
  <span>Trash</span>
</div>


    <div class="window" id="notes" data-title="Notepad">
      <div class="titlebar">
        <span>Notepad</span>
        <div>
          <button onclick="minWin('notes')">_</button>
          <button onclick="closeWin('notes')">X</button>
        </div>
      </div>
      <div class="windowbody">
        <textarea id="notesArea" placeholder="Write something..."></textarea>
        <span class="savedtag" id="savedTag">saved</span>
      </div>
    </div>

    <div class="window terminal" id="terminal" data-title="Terminal">
      <div class="titlebar">
        <span>Terminal</span>
        <div>
          <button onclick="minWin('terminal')">_</button>
          <button onclick="closeWin('terminal')">X</button>
        </div>
      </div>
      <div class="terminalbody" id="terminalBody">
        <p>MlinuxOS Terminal</p>
        <p>Type <b>help</b> to see commands.</p>
        <div class="terminalinput">
          <span>user@mlinux:~$</span>
          <input id="commandInput" autocomplete="off">
        </div>
      </div>
    </div>

    <div class="window files" id="files" data-title="Files">
      <div class="titlebar">
        <span>Files</span>
        <div>
          <button onclick="minWin('files')">_</button>
          <button onclick="closeWin('files')">X</button>
        </div>
      </div>
      <div class="windowbody">
        <h3>Home</h3>
        <div class="file"><span></span> Documents</div>
        <div class="file"><span></span> Downloads</div>
        <div class="file"><span></span> Projects</div>
      </div>
    </div>

    <div class="window" id="weather" data-title="Weather">
      <div class="titlebar">
        <span>Weather</span>
        <div>
          <button onclick="minWin('weather')">_</button>
          <button onclick="closeWin('weather')">X</button>
        </div>
      </div>
      <div class="windowbody weatherbody" id="weatherBody">
        loading...
      </div>
    </div>

    <div class="window" id="settings" data-title="Settings">
      <div class="titlebar">
        <span>Settings</span>
        <div>
          <button onclick="minWin('settings')">_</button>
          <button onclick="closeWin('settings')">X</button>
        </div>
      </div>
      <div class="windowbody">
        <label>Accent color</label>
        <div class="swatches">
          <div class="swatch active" style="background:#3d78b8" data-accent="blue"></div>
          <div class="swatch" style="background:#3d8b5a" data-accent="green"></div>
          <div class="swatch" style="background:#6a4d9e" data-accent="purple"></div>
          <div class="swatch" style="background:#a13d3d" data-accent="red"></div>
        </div>
      </div>
    </div>

  </div>
  <div class="selectbox" id="selectBox"></div>
  <div class="ctxmenu" id="ctxMenu">
    <div class="ctxitem" onclick="openWin('files')">Open Files</div>
    <div class="ctxitem" onclick="openWin('terminal')">Open Terminal</div>
    <div class="ctxsep"></div>
    <div class="ctxitem" onclick="refreshDesktop()">Refresh</div>
    <div class="ctxitem" onclick="openWin('settings')">Settings</div>
  </div>

  <div class="taskbar">
    <button class="startbutton" id="startButton">Start</button>
    <div class="taskapps" id="taskApps"></div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="startmenu" id="startMenu">
    <div class="starttitle">MlinuxOS</div>
    <div class="startitem" onclick="openWin('files')">Files</div>
    <div class="startitem" onclick="openWin('notes')">Notepad</div>
    <div class="startitem" onclick="openWin('terminal')">Terminal</div>
    <div class="startitem" onclick="openWin('weather')">Weather</div>
    <div class="startitem" onclick="openWin('settings')">Settings</div>
  </div>


  <script src="script.js"></script>

</body>
</html>
